[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-sorter"
version = "0.1.0"
description = "Sort a folder of receipt files (PDF/JPG/PNG) into year/month/category folders and write a CSV expense summary."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["receipts", "bookkeeping", "expenses", "ocr", "organization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.scripts]
receipt-sorter = "receipt_sorter.cli:main"

[project.optional-dependencies]
ocr = ["pytesseract>=0.3"]
pdf = ["pdfplumber>=0.11"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["receipt_sorter*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]